<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>Info — Opsidev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .info-hero { padding-bottom: 20px; text-align: center; }
    .info-hero h1 span { color: var(--cyan); }
    .info-hero > p { margin-left: auto; margin-right: auto; max-width: 340px; }

    .feature-list { display: grid; gap: 12px; margin-top: 8px; }
    .feature-card { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(145deg, rgba(20, 28, 47, .92), rgba(14, 20, 35, .92)); }
    .feature-icon { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; background: rgba(112, 137, 255, .1); color: #9eafff; }
    .feature-icon svg { width: 20px; height: 20px; }
    .feature-body { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .feature-body b { font-size: 13px; color: #dbe3f6; }
    .feature-body small { color: var(--muted); font-size: 11px; line-height: 1.6; }

    .cta-card { margin-top: 24px; padding: 20px; border-radius: 20px; border: 1px solid rgba(105,228,177,.2); background: linear-gradient(145deg, rgba(15,30,25,.9), rgba(10,20,15,.9)); text-align: center; }
    .cta-card h3 { margin: 0 0 8px; font-size: 16px; color: #fff; }
    .cta-card p { margin: 0 0 16px; color: #8ee8c3; font-size: 12px; line-height: 1.6; }
    .wa-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 12px; background: linear-gradient(110deg, #25d366, #128c7e); color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; }
    .wa-button svg { width: 16px; height: 16px; }

    .credit-list { margin-top: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(7,11,21,.3); display: grid; gap: 10px; }
    .credit-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
    .credit-item span { color: var(--muted); }
    .credit-item a { color: #9eafff; text-decoration: none; font-weight: 700; }

    .version-tag { display: inline-block; padding: 4px 10px; border-radius: 8px; background: rgba(117,144,255,.1); border: 1px solid rgba(117,144,255,.24); color: #9eafff; font-size: 9px; font-weight: 800; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="app">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-icon"><i data-lucide="layers"></i></span>
        <span class="brand-copy"><strong>Opsidev</strong><small>WEBSITE UNTUK SEMUA</small></span>
      </a>
      <button class="icon-button" type="button" id="helpBtn" aria-label="Bantuan"><i data-lucide="circle-help"></i></button>
    </header>

    <section class="hero info-hero">
      <div class="hero-label"><span class="live-dot"></span> OPSIDEV</div>
      <h1 id="infoTagline">Memuat…</h1>
      <p id="infoSubtitle"></p>
      <div style="margin-top:16px;"><span class="version-tag" id="infoBadge"></span></div>
    </section>

    <div class="section-heading">
      <div><span class="eyebrow">FITUR</span><h2>Yang kamu dapat</h2></div>
    </div>

    <div class="feature-list" id="featureList"></div>

    <div class="cta-card" id="contactCard">
      <h3 id="contactTitle"></h3>
      <p id="contactDesc"></p>
      <a class="wa-button" id="waContact" href="#" target="_blank" rel="noopener noreferrer">
        <i data-lucide="message-circle"></i>
        <span id="contactLabel">Chat Admin</span>
      </a>
    </div>

    <div class="section-heading" style="margin-top:28px;">
      <div><span class="eyebrow">THANKS TO</span><h2>Terima kasih</h2></div>
    </div>

    <div class="credit-list" id="thanksList"></div>

    <footer class="footer">
      <span class="footer-mark"><i data-lucide="layers"></i></span>
      <p><b id="footerBrand">OPSIDEV</b> · <span id="footerSub">Website untuk semua</span></p>
      <small>Made for your next idea.</small>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <a href="index.html" class="nav-item"><i data-lucide="hammer"></i><span>Build</span></a>
    <a href="tools1.html" class="nav-item"><i data-lucide="wrench"></i><span>Tools 1</span></a>
    <a href="tools2.html" class="nav-item"><i data-lucide="package"></i><span>Tools 2</span></a>
    <a href="search-tools.html" class="nav-item"><i data-lucide="search"></i><span>Cari</span></a>
    <a href="info.html" class="nav-item active" aria-current="page"><i data-lucide="info"></i><span>Info</span></a>
  </nav>

  <div class="modal-backdrop hidden" id="helpModal">
    <section class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="closeHelp" type="button"><i data-lucide="x"></i></button>
      <span class="section-icon"><i data-lucide="circle-help"></i></span>
      <h3>Bantuan Info</h3>
      <p>Semua fitur gratis dan tanpa login. Kalau ada masalah, klik tombol Chat Admin.</p>
      <button class="primary-button" id="closeHelpBottom" type="button">Mengerti</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="info-content.js"></script>
  <script>
  (function () {
    'use strict';

    const $ = (s) => document.querySelector(s);
    const escapeHtml = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Fallback default kalau info-content.js tidak ada
    const DEFAULTS = {
      tagline: "website untuk semua",
      badge: "v2.0 · FREE FOREVER",
      subtitle: "Tanpa login. Tanpa daftar. Tanpa batas.",
      features: [],
      contact: { title: "Ada masalah?", desc: "Hubungi admin via WhatsApp.", wa: "6285196241829", message: "Halo Admin Opsidev.", label: "Chat Admin" },
      thanks: [
        { label: "codeku.izzcs", url: "https://codeku.izzcs.my.id" },
        { label: "vamxapi", url: "https://vamxapi.my.id" }
      ],
      footer: { brand: "OPSIDEV", sub: "Website untuk semua" }
    };

    const C = Object.assign({}, DEFAULTS, window.INFO_CONTENT || {});

    // Tagline: kata terakhir di-highlight warna cyan
    function renderTagline(text) {
      const t = String(text || '').trim();
      const parts = t.split(/\s+/);
      if (parts.length <= 1) return escapeHtml(t);
      const last = parts.pop();
      return escapeHtml(parts.join(' ')) + ' <span>' + escapeHtml(last) + '</span>.';
    }

    $('#infoTagline').innerHTML = renderTagline(C.tagline);
    $('#infoSubtitle').textContent = C.subtitle || '';
    $('#infoBadge').textContent = C.badge || '';

    // Features
    const featureList = $('#featureList');
    featureList.innerHTML = (C.features || []).map(f => (
      '<div class="feature-card">' +
        '<span class="feature-icon"><i data-lucide="' + escapeHtml(f.icon || 'star') + '"></i></span>' +
        '<div class="feature-body">' +
          '<b>' + escapeHtml(f.title || '') + '</b>' +
          '<small>' + escapeHtml(f.desc || '') + '</small>' +
        '</div>' +
      '</div>'
    )).join('');

    // Contact
    if (C.contact) {
      $('#contactTitle').textContent = C.contact.title || '';
      $('#contactDesc').textContent = C.contact.desc || '';
      $('#contactLabel').textContent = C.contact.label || 'Chat Admin';
      const waNum = String(C.contact.wa || '').replace(/[^0-9]/g, '');
      const waText = encodeURIComponent(C.contact.message || 'Halo Admin Opsidev.');
      const waEl = $('#waContact');
      if (waNum) waEl.href = 'https://wa.me/' + waNum + '?text=' + waText;
    }

    // Thanks
    const thanksList = $('#thanksList');
    if (C.thanks && C.thanks.length > 0) {
      thanksList.innerHTML = C.thanks.map(t => (
        '<div class="credit-item">' +
          '<span>Thanks to</span>' +
          '<a href="' + escapeHtml(t.url || '#') + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(t.label || '') + '</a>' +
        '</div>'
      )).join('');
    } else {
      thanksList.style.display = 'none';
    }

    // Footer
    if (C.footer) {
      $('#footerBrand').textContent = C.footer.brand || 'OPSIDEV';
      $('#footerSub').textContent = C.footer.sub || 'Website untuk semua';
    }

    // Help modal
    const helpModal = $('#helpModal');
    document.getElementById('helpBtn')?.addEventListener('click', () => helpModal?.classList.remove('hidden'));
    const closeHelp = () => helpModal?.classList.add('hidden');
    document.getElementById('closeHelp')?.addEventListener('click', closeHelp);
    document.getElementById('closeHelpBottom')?.addEventListener('click', closeHelp);
    helpModal?.addEventListener('click', (e) => { if (e.target === helpModal) closeHelp(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && helpModal && !helpModal.classList.contains('hidden')) closeHelp(); });

    if (window.lucide) window.lucide.createIcons();
  })();
  </script>
</body>
</html>
